  /admin/dashboard:
    get:
      operationId: adminGetDashboard
      summary: Read real operational metrics and inventory alerts
      description: No-store. All aggregates from one consistent MySQL read snapshot. The query date D defaults
        to today in Asia/Shanghai. Summary, Top10, meal counts and low-stock alerts all use D; trend spans D-6
        through D inclusive. Response date echoes D; generatedAt is the current UTC generation time.
        pendingOrders combines
        Pending and Confirmed. Top10 aggregates configurations by dish ID, ties by dish ID ascending; historical
        snapshots define displayed sold name. Current low-stock list uses scheduled published supply for the
        selected date, read at query time rather than reconstructed as historical stock. Revenue and sold
        quantities include Completed orders only; amounts include add-ons and do not represent payments.
      tags:
      - Console
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          description: English error with stable business code. See README.md for recovery rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: English error with stable business code. See README.md for recovery rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: English error with stable business code. See README.md for recovery rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: English error with stable business code. See README.md for recovery rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Query date D for every metric, including low-stock alerts; defaults to today in
          Asia/Shanghai. Trend includes D and prior six calendar days. A valid past or future date is accepted;
          an invalid calendar date returns 400. Response date echoes the effective D.
