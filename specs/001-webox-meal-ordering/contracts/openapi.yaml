      operationId: adminChangeOrderStatus
      summary: Confirm, complete or cancel a pending order
      description: After Admin and CSRF checks, lock owner then order. Pending->Confirmed, Confirmed->Completed
        and Pending->Cancelled only. If current and requested status are both Cancelled, return 200 current
        AdminOrder before comparing expectedVersion, without changing version, timestamps, inventory or outbox.
        Otherwise stale expectedVersion returns 409 VERSION_CONFLICT; invalid transition returns INVALID_ORDER_TRANSITION.
        Cancellation restores original-date supply once. Completion releases active-slot uniqueness without
        restoring stock.
      tags:
      - Console
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
