components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: WEBOXSESSION
      description: Opaque server session; HttpOnly, Secure in production, SameSite=Lax. All personal responses
        no-store.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Token from GET /auth/csrf, bound to the accompanying session cookie; refresh after login/logout.
  schemas:
    Id:
      type: string
      format: uuid
    Version:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    MoneyCents:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    Category:
      type: string
      enum:
      - Chinese
      - Western
      - Japanese
      - Light Meal
      - Korean
      - Southeast Asian
    SpiceLevel:
      type: string
      enum:
