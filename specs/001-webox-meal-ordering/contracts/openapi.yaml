          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      - name: categories
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          minItems: 0
          maxItems: 6
          uniqueItems: true
        style: form
        explode: true
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
      - name: recommended
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 24
