            schema:
              $ref: '#/components/schemas/QuoteRequest'
  /orders:
    post:
      operationId: placeOrder
      summary: Create exactly one order for a confirmed quote
      description: 'Server resolves address, verifies ownership and canonical payload. Successful same key/hash
        replays original order (200) before quote/cutoff/stock checks, even after cancellation/completion/quote
        expiry. Different payload with same successful key -> IDEMPOTENCY_KEY_REUSED. Quote can be consumed
        once: new key plus consumed quote -> QUOTE_CONSUMED. Short transaction commits order/snapshots/new
        address/stock/outbox together. Existing active order -> ACTIVE_ORDER_EXISTS with own existingOrderId.
        No partial success.'
      tags:
      - Employee
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: English error with stable business code. See README.md for recovery rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: English error with stable business code. See README.md for recovery rules.
          content:
