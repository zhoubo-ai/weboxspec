  /menus/{date}:
    get:
      operationId: getMenu
      summary: Browse a daily menu
      description: Only scheduled and published dishes. Zero stock remains visible as Sold Out. Categories
        OR; keyword matches name/description case-insensitively and ANDs with category selection. Default name
        ascending, ID tiebreak. Recommended groups cuisine matches first then spice; preserves filters. Missing
        date menu returns an empty page, not fabricated items. Live quantities are not cached.
      tags:
      - Employee
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPage'
        '400':
          description: English error with stable business code. See README.md for recovery rules.
