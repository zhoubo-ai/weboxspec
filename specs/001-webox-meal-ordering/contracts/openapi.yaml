        in: path
        required: true
        schema:
          type: string
          format: date
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 100
        description: Accepted but not used as a guaranteed replay cursor; every connection starts with a fresh
          snapshot.
  /checkout/quotes:
    post:
      operationId: createQuote
      summary: Validate a cart and create a five-minute quote
      description: Does not reserve stock. Past date -> 422 INVALID_DELIVERY_DATE; expired slot -> 409 SLOT_EXPIRED
        with suggested date/meal; existing active order -> ACTIVE_ORDER_EXISTS. UI changes selection and re-quotes
        visibly. Invalid/changed dish -> DISH_CHANGED or DISH_UNAVAILABLE with itemIssues. Insufficient stock
        -> INSUFFICIENT_STOCK. A price change must be confirmed before a new quote is accepted.
      tags:
      - Employee
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '422':
