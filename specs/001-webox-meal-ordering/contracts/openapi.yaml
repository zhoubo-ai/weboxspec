  /menus/{date}/events:
    get:
      operationId: streamInventory
      summary: Subscribe to inventory updates
      description: Same-origin EventSource GET. Events inventory.snapshot, inventory.updated, menu.changed,
        session.expired. See streaming.md. No personalized data. No proxy buffering; reconnect snapshot and
        absolute row versions handle duplicates/out-of-order delivery.
      tags:
      - Employee
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                heartbeat:
                  value: ': heartbeat


                    '
        '400':
          description: English error with stable business code. See README.md for recovery rules.
