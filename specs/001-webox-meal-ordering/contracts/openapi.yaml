  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel own pending order once
      description: Pending -> Cancelled with one stock restoration. Cancelled -> return current order without
        restoring again. Confirmed/Completed -> ORDER_NOT_CANCELLABLE. Ownership failure returns 404. Races
        with admin confirmation serialize on owner/order locks.
      tags:
      - Employee
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: English error with stable business code. See README.md for recovery rules.
          content:
